# Servicios locales: MongoDB (replica set de 1 nodo), MailHog y RustFS (S3).
# `pnpm services:up` los levanta y espera a que estén sanos.
name: bonos

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017" # MONGO_PORT si el 27017 del host ya está ocupado
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Inicializa el replica set la primera vez; responde OK cuando hay PRIMARY.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
          | grep -q 1
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 5s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI + API
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v2/messages?limit=1 >/dev/null || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Consola
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    command: ["/data"]

  # Crea el bucket automáticamente (idempotente) y termina.
  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ${S3_BUCKET:-bonds-docs} 2>/dev/null && exit 0
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket ${S3_BUCKET:-bonds-docs} 2>/dev/null && exit 0
          sleep 2
        done
        exit 1
    restart: "no"

volumes:
  mongo-data:
  rustfs-data:
