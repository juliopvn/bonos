# CI de GitLab — se construye por etapas según lo que muestra el runner real (docs/ci-notes.md).
# El runner online (cloudrun-ephemeral) exige el tag `cloudrun`, ignora `image:` (Node 22 / Ubuntu 24.04),
# no tiene Docker ni `services:` y sí tiene salida a internet.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

default:
  tags: [cloudrun]
  interruptible: true

stages: [diagnose, quality, test, build]

variables:
  GIT_DEPTH: "20"
  PNPM_STORE: "$CI_PROJECT_DIR/.pnpm-store"
  MONGOMS_DOWNLOAD_DIR: "$CI_PROJECT_DIR/.cache/mongodb-binaries"
  NEXT_TELEMETRY_DISABLED: "1"

.node:
  image: node:24-bookworm
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths:
      - .pnpm-store
      - .cache/mongodb-binaries
  before_script:
    - node -v
    - npm install -g pnpm@12.8.1
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile

# ── Etapa 1: calidad ───────────────────────────────────────────
quality:
  extends: .node
  stage: quality
  script:
    - pnpm lint
    - pnpm typecheck

# ── Etapa 2: unit + integración (Mongo en memoria: el runner no tiene Docker) ──
test:
  extends: .node
  stage: test
  variables:
    INTEGRATION_MONGO: memory
  script:
    - pnpm exec vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths: [coverage/]
    reports:
      junit: test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# ── Etapa 3: build de producción ──
build:
  extends: .node
  stage: build
  script:
    - pnpm build

# ── Diagnóstico del runner (manual) ────────────────────────────
diagnose:
  stage: diagnose
  when: manual
  allow_failure: true
  script:
    - |
      echo "desc=$CI_RUNNER_DESCRIPTION tags=$CI_RUNNER_TAGS"
      node -v; nproc; free -m; df -h /dev/shm
      (docker version || echo "docker no disponible")
